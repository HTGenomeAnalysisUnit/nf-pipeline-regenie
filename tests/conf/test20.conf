/*
========================================================================================
    TEST 19: BGEN input - step2 split - quant phenotype - 3 covars - No SAMPLE - NO BGI
========================================================================================
*/

params {
    project                       = 'test20'
    genotypes_array               = "$baseDir/tests/input/pipeline/example_step1"
    genotypes_imputed             = "$baseDir/tests/input/pipeline/example.bgen"
    genotypes_imputed_format      = 'bgen'
    genotypes_build               = 'hg19'
    chromosomes                   = '1,2'

    models_table		  = "$baseDir/tests/input/pipeline/models_input.txt"    
    phenotypes_filename           = "$baseDir/tests/input/pipeline/pheno_and_covars.txt"
    
    step1_n_chunks                = 2

    step2_gwas_split              = true
    step2_gwas_chunk_size         = 250
    
    clump_p1                      = 0.01
    clump_p2                      = 0.05
    annotation_min_log10p         = 2
}
