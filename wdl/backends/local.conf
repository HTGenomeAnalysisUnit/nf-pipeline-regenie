# =============================================================================
# Cromwell Backend Configuration: Local
# =============================================================================
# Run all tasks locally on the machine running Cromwell.
# Suitable for testing and small datasets.
#
# Usage:
#   java -jar cromwell.jar run regenie_gwas.wdl \
#     -i inputs.json -o options.json \
#     -Dconfig.file=backends/local.conf
# =============================================================================

backend {
  default = "Local"
  providers {
    Local {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        # Number of concurrent jobs
        concurrent-job-limit = 10

        # Runtime attributes with defaults
        runtime-attributes = """
          Int cpu = 1
          Int memory_mb = 4000
          String? docker
        """

        # Submit command
        submit = """
          /usr/bin/env bash ${script}
        """

        # Submit with Docker
        submit-docker = """
          docker run \
            --rm -i \
            --cpus ${cpu} \
            --memory ${memory_mb}m \
            -v ${cwd}:${docker_cwd}:delegated \
            ${docker} /bin/bash ${docker_script}
        """

        # Kill command
        kill = "kill ${job_id}"
        kill-docker = "docker kill ${job_id}"

        # Check alive
        check-alive = "ps -p ${job_id}"

        # Job ID regex
        job-id-regex = "(\\d+)"

        filesystems {
          local {
            localization: [
              "hard-link", "soft-link", "copy"
            ]
            caching {
              duplication-strategy: [
                "hard-link", "soft-link", "copy"
              ]
              hashing-strategy: "fingerprint"
            }
          }
        }
      }
    }
  }
}

# Limit call caching to improve test reproducibility
call-caching {
  enabled = true
  invalidate-bad-cache-results = true
}

# Workflow options
workflow-options {
  workflow-log-dir = "cromwell-workflow-logs"
  workflow-log-temporary = false
}
