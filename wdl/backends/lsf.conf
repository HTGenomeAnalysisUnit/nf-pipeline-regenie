# =============================================================================
# Cromwell Backend Configuration: LSF
# =============================================================================
# Submit tasks to an IBM Spectrum LSF cluster via bsub.
#
# Usage:
#   java -jar cromwell.jar run regenie_gwas.wdl \
#     -i inputs.json -o options.json \
#     -Dconfig.file=backends/lsf.conf
#
# Customization:
#   - Set LSF_QUEUE env var or edit the queue below
#   - Set LSF_PROJECT env var or edit the project below
#   - Adjust concurrent-job-limit as appropriate for your cluster
# =============================================================================

backend {
  default = "LSF"
  providers {
    LSF {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        # Maximum concurrent jobs submitted to LSF
        concurrent-job-limit = 50

        # Seconds between polling for job completion
        exit-code-timeout-seconds = 120

        runtime-attributes = """
          Int cpu = 1
          Int memory_mb = 4000
          String? docker
          Int time_minutes = 480
          String? lsf_queue
          String? lsf_project
          String? lsf_extra
        """

        # LSF bsub submission command
        submit = """
          bsub \
            -J ${job_name} \
            -cwd ${cwd} \
            -o ${out} \
            -e ${err} \
            -n ${cpu} \
            -R "rusage[mem=${memory_mb}] span[hosts=1]" \
            -M ${memory_mb} \
            -W ${time_minutes} \
            ${"-q " + lsf_queue} \
            ${"-P " + lsf_project} \
            ${lsf_extra} \
            /usr/bin/env bash ${script}
        """

        # LSF bsub submission with Singularity
        submit-docker = """
          # Build Singularity image from Docker if not cached
          SINGULARITY_IMAGE_DIR="${cwd}/singularity_images"
          mkdir -p $SINGULARITY_IMAGE_DIR

          DOCKER_NAME=$(echo ${docker} | sed 's|[/:.]|_|g')
          SINGULARITY_IMAGE="$SINGULARITY_IMAGE_DIR/$DOCKER_NAME.sif"

          if [ ! -f "$SINGULARITY_IMAGE" ]; then
            singularity pull "$SINGULARITY_IMAGE" "docker://${docker}"
          fi

          bsub \
            -J ${job_name} \
            -cwd ${cwd} \
            -o ${out} \
            -e ${err} \
            -n ${cpu} \
            -R "rusage[mem=${memory_mb}] span[hosts=1]" \
            -M ${memory_mb} \
            -W ${time_minutes} \
            ${"-q " + lsf_queue} \
            ${"-P " + lsf_project} \
            ${lsf_extra} \
            singularity exec --bind ${cwd}:${docker_cwd} $SINGULARITY_IMAGE /bin/bash ${docker_script}
        """

        # Cancel an LSF job
        kill = "bkill ${job_id}"

        # Check if an LSF job is still running
        check-alive = "bjobs -noheader ${job_id}"

        # Regex to extract job ID from bsub output
        # bsub outputs: "Job <12345> is submitted to queue <normal>."
        job-id-regex = "Job <(\\d+)>"

        filesystems {
          local {
            localization: [
              "hard-link", "soft-link", "copy"
            ]
            caching {
              duplication-strategy: [
                "hard-link", "soft-link", "copy"
              ]
              hashing-strategy: "fingerprint"
            }
          }
        }
      }
    }
  }
}

call-caching {
  enabled = true
  invalidate-bad-cache-results = true
}

workflow-options {
  workflow-log-dir = "cromwell-workflow-logs"
  workflow-log-temporary = false
}
