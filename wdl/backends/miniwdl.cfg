# =============================================================================
# miniwdl Configuration for SLURM
# =============================================================================
# Place this file at one of:
#   1. ./miniwdl.cfg                (current directory)
#   2. ~/.config/miniwdl.cfg        (user config)
#   3. /etc/miniwdl.cfg             (system-wide)
# Or set MINIWDL__CFG=/path/to/miniwdl.cfg
#
# Requires: pip install miniwdl miniwdl-slurm
# =============================================================================

[scheduler]
# Use the SLURM backend plugin
container_backend = slurm_singularity

# Maximum concurrent tasks
call_concurrency = 50

[task_runtime]
# Default runtime values (used if not specified in WDL)
defaults = {
    "cpu": 1,
    "memory": "4G",
    "maxRetries": 3,
    "docker": "htgenomeanalysisunit/gwas-nf-pipeline:0.7"
  }

[singularity]
# Auto-pull Docker images as Singularity SIF files
# Set the cache directory for pulled images
image_cache = /tmp/miniwdl_singularity_cache

# Extra singularity exec arguments (e.g., bind paths)
# Uncomment and adjust for your environment:
# extra_args = --bind /scratch:/scratch --bind /data:/data

[slurm]
# SLURM-specific options for the miniwdl-slurm plugin
#
# Extra sbatch arguments (uncomment and customize):
# extra_args = --partition=normal --account=myaccount

[file_io]
# Use hard-links when possible (faster for large genomic files)
copy_input_files = false

[download_cache]
# Cache directory for downloaded input files
put = true
get = true
dir = /tmp/miniwdl_download_cache

[logging]
# Logging level: one of DEBUG, INFO, WARNING, ERROR
json = false
