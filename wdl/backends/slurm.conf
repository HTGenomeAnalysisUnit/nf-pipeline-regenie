# =============================================================================
# Cromwell Backend Configuration: SLURM
# =============================================================================
# Submit tasks to a SLURM cluster via sbatch.
#
# Usage:
#   java -jar cromwell.jar run regenie_gwas.wdl \
#     -i inputs.json -o options.json \
#     -Dconfig.file=backends/slurm.conf
#
# Customization:
#   - Set SLURM_PARTITION env var or edit the partition below
#   - Set SLURM_ACCOUNT env var or edit the account below
#   - Set SLURM_QOS for quality-of-service if needed
#   - Adjust concurrent-job-limit as appropriate for your cluster
# =============================================================================

backend {
  default = "SLURM"
  providers {
    SLURM {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        # Maximum concurrent jobs submitted to SLURM
        concurrent-job-limit = 50

        # Seconds between polling for job completion
        exit-code-timeout-seconds = 120

        runtime-attributes = """
          Int cpu = 1
          Int memory_mb = 4000
          String? docker
          Int time_minutes = 480
          String? slurm_partition
          String? slurm_account
          String? slurm_qos
          String? slurm_extra
        """

        # SLURM sbatch submission command
        submit = """
          sbatch \
            --job-name=${job_name} \
            --chdir=${cwd} \
            --output=${out} \
            --error=${err} \
            --ntasks=1 \
            --cpus-per-task=${cpu} \
            --mem=${memory_mb}M \
            --time=${time_minutes} \
            ${"--partition=" + slurm_partition} \
            ${"--account=" + slurm_account} \
            ${"--qos=" + slurm_qos} \
            ${slurm_extra} \
            --wrap "/usr/bin/env bash ${script}"
        """

        # SLURM sbatch submission with Singularity
        # (Docker images auto-converted to Singularity on HPC)
        submit-docker = """
          # Build Singularity image from Docker if not cached
          SINGULARITY_IMAGE_DIR="${cwd}/singularity_images"
          mkdir -p $SINGULARITY_IMAGE_DIR

          DOCKER_NAME=$(echo ${docker} | sed 's|[/:.]|_|g')
          SINGULARITY_IMAGE="$SINGULARITY_IMAGE_DIR/$DOCKER_NAME.sif"

          if [ ! -f "$SINGULARITY_IMAGE" ]; then
            singularity pull "$SINGULARITY_IMAGE" "docker://${docker}"
          fi

          sbatch \
            --job-name=${job_name} \
            --chdir=${cwd} \
            --output=${out} \
            --error=${err} \
            --ntasks=1 \
            --cpus-per-task=${cpu} \
            --mem=${memory_mb}M \
            --time=${time_minutes} \
            ${"--partition=" + slurm_partition} \
            ${"--account=" + slurm_account} \
            ${"--qos=" + slurm_qos} \
            ${slurm_extra} \
            --wrap "singularity exec --bind ${cwd}:${docker_cwd} $SINGULARITY_IMAGE /bin/bash ${docker_script}"
        """

        # Cancel a SLURM job
        kill = "scancel ${job_id}"

        # Check if a SLURM job is still running
        check-alive = "squeue -j ${job_id} -h"

        # Regex to extract job ID from sbatch output
        # sbatch outputs: "Submitted batch job 12345"
        job-id-regex = "Submitted batch job (\\d+)"

        filesystems {
          local {
            localization: [
              "hard-link", "soft-link", "copy"
            ]
            caching {
              duplication-strategy: [
                "hard-link", "soft-link", "copy"
              ]
              hashing-strategy: "fingerprint"
            }
          }
        }
      }
    }
  }
}

call-caching {
  enabled = true
  invalidate-bad-cache-results = true
}

workflow-options {
  workflow-log-dir = "cromwell-workflow-logs"
  workflow-log-temporary = false
}
